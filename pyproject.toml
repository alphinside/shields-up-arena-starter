[project]
name = "starter"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "your@email.com"},
]
requires-python = ">=3.11,<3.14"
# Below google-adk 2.14.0, google-genai 2.34.0, google-cloud-aiplatform 2.7.0 and
# google-auth 2.62.1, AgentEngineSandboxCodeExecutor gets a 401 under Agent Identity.
dependencies = [
    "google-adk[gcp,otel-gcp,mcp]==2.14.0",
    "google-genai==2.34.0",
    "google-auth==2.62.1",
    "google-cloud-aiplatform[agent-engines]==2.7.0",
    "google-cloud-agentplatform[agent-engines]==2.7.0",
    # Version the trace content capture settings were verified against.
    "opentelemetry-instrumentation-google-genai==0.7b1",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    # Pre-locked so participants can add Model Armor without re-locking.
    "google-cloud-modelarmor==0.7.4",
    "matplotlib==3.10.7",
    "pandas==2.3.3",
    "a2a-sdk[http-server]>=1.0,<2",
    "google-cloud-logging>=3.12,<4",
    "protobuf>=6.31.1,<7",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "google-cloud-bigquery>=3.27.0,<4.0.0",
    "pyyaml>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,**/package-lock.json"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
